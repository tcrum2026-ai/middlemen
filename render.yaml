# Render blueprint — https://render.com/docs/blueprint-spec
#
# Two ways to run this, and the difference is whether the data survives.
#
#   Free plan:   no disk, and the service sleeps when idle. The database
#                falls back to a temporary directory and is wiped whenever
#                the service restarts. Fine for a demo, wrong for customers.
#   Starter:     add the `disk` block below and set plan: starter. The data
#                then lives on a real volume and survives deploys. This costs
#                money — a few dollars a month — and is the only configuration
#                you should point a real customer at.
#
# Create → Blueprint, point it at this repo, and Render reads this file.

services:
  - type: web
    name: lobby
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: false

    # Uncomment together with plan: starter to keep your data.
    # disk:
    #   name: lobby-data
    #   mountPath: /data
    #   sizeGB: 1

    envVars:
      # Set by the image; repeated here so it is visible where you configure.
      - key: LOBBY_DATA_DIR
        value: /data

      # Render sets this for you; the app prints canonical URLs with it.
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          type: web
          name: lobby
          property: host

      # ── Turn the demo on, or leave it off for a real deployment ──────────
      # With this set, the seeded workspace has a shared owner and anyone
      # with the link can drive every feature. Leave it unset for real use.
      - key: LOBBY_DEMO_PASSWORD
        sync: false
      - key: LOBBY_DEMO_EMAIL
        sync: false

      # ── Everything below costs money and is deliberately unset ───────────
      # The app refuses to pretend when one of these is missing: it says so
      # on the page rather than failing quietly. Add them when you are ready.
      #
      #   ANTHROPIC_API_KEY      real replies instead of the scripted engine
      #   STRIPE_SECRET_KEY      taking subscriptions
      #   STRIPE_WEBHOOK_SECRET  required with the above; fails closed
      #   STRIPE_PRICE_STARTER / _PRO / _BUSINESS
      #   RESEND_API_KEY + AUTH_FROM_EMAIL   password reset, email verification
      #   VOICE_BRIDGE_SECRET / _URL         answering phone calls
      #   CRON_SECRET            only if you set LOBBY_SCHEDULER=off
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_FROM_EMAIL
        sync: false

      - key: NEXT_PUBLIC_LEGAL_ENTITY
        sync: false
      - key: NEXT_PUBLIC_CONTACT_EMAIL
        sync: false
      - key: NEXT_PUBLIC_LEGAL_JURISDICTION
        sync: false
